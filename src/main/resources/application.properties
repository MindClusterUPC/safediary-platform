# ===================================================================
# SafeDiary Platform Configuration
# ===================================================================

# Spring Application Name
spring.application.name=safediary-platform

# Server Configuration
server.port=8080

# Spring Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/safediary_db
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.mindcluster.safediary.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# OpenAPI / Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=none

# AssistantAI - LLM provider (gemini | mock)
assistantai.llm.provider=${ASSISTANTAI_LLM_PROVIDER:gemini}
assistantai.llm.gemini.api-key=${GEMINI_API_KEY:}
assistantai.llm.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
assistantai.llm.gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
assistantai.llm.gemini.base-url=https://generativelanguage.googleapis.com
assistantai.llm.gemini.timeout-seconds=30
assistantai.llm.history-limit=20

# AssistantAI - weekly clinical summary
assistantai.clinical-summary.zone=America/Lima
assistantai.clinical-summary.scheduler.enabled=true
assistantai.clinical-summary.cron=0 0 23 * * SUN

# Account used by /api/v1/assistant/chat until IAM exists
assistantai.demo-account-id=1
