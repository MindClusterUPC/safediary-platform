# Render Blueprint: backend (Docker). The PostgreSQL database is external (filess.io).
# Render dashboard -> New -> Blueprint -> pick this repository.
# On first deploy Render asks for the values marked "sync: false" (API keys); they never live in git.
services:
  - type: web
    name: safediary-platform
    runtime: docker
    plan: free
    branch: main
    region: oregon
    healthCheckPath: /v3/api-docs
    autoDeploy: true
    envVars:
      # External PostgreSQL (filess.io). Fill these in the Render dashboard; they never live in git.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Gemini (primary). gemini-3.5-flash-lite answers in about 1 s; the bigger model was often overloaded.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_FALLBACK_MODEL
        value: ""
      # Groq (backup provider, OpenAI-compatible)
      - key: LLM_BACKUP_API_KEY
        sync: false

