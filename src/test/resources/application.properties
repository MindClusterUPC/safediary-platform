spring.application.name=safediary-platform
spring.datasource.url=jdbc:h2:mem:safediary_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.hibernate.naming.physical-strategy=com.mindcluster.safediary.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
assistantai.llm.provider=mock
