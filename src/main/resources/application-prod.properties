# ===================================================================
# Production profile (Render). Activated with SPRING_PROFILES_ACTIVE=prod.
# Every value comes from environment variables: there are no defaults, so a missing one stops the app at startup.
# ===================================================================

# PostgreSQL provided by Render (see render.yaml)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Quiet logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO

# Render terminates HTTPS in its proxy
server.forward-headers-strategy=framework
