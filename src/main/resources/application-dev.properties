# ===================================================================
# Development profile (local machine). Active by default.
# Local secrets (API keys) go in config/application.properties, which git ignores.
# ===================================================================

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safediary_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:12345678}

# Default to mock LLM locally so it boots without requiring GEMINI_API_KEY
assistantai.llm.provider=${ASSISTANTAI_LLM_PROVIDER:mock}

# Show the SQL Hibernate runs
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Temporary development identity for Clinician Directory until IAM is integrated.
clinician-directory.demo-identity.enabled=true

# Care Scheduling development adapters until IAM and appointment charges in Payments exist:
# X-Account-Id/X-Role identity, X-Consent-Ref consent and a simulated payment result endpoint.
care-scheduling.demo-identity.enabled=true
care-scheduling.payment-simulation.enabled=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
