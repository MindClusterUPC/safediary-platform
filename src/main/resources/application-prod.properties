# ===================================================================
# Production profile (Render). Activated with SPRING_PROFILES_ACTIVE=prod.
# Every value comes from environment variables: there are no defaults, so a missing one stops the app at startup.
# ===================================================================

# External PostgreSQL (filess.io); credentials come from the Render dashboard
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Free database plans allow very few simultaneous connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1

# Quiet logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO

# Render terminates HTTPS in its proxy
server.forward-headers-strategy=framework
