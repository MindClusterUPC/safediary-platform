# ===================================================================
# Development profile (local machine). Active by default.
# Local secrets (API keys) go in config/application.properties, which git ignores.
# ===================================================================

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safediary_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:12345678}

# Show the SQL Hibernate runs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
