# ===================================================================
# SafeDiary Platform Configuration
# ===================================================================

# Spring Application Name
spring.application.name=safediary-platform

# Environment profile: dev (default, local machine) | prod (Render). See docs/ENVIRONMENTS.md
spring.profiles.default=dev

# Server Configuration
server.port=${PORT:8080}

# Spring Database Configuration (PostgreSQL): connection settings live in application-{dev,prod}.properties
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.database=postgresql
spring.jpa.open-in-view=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.mindcluster.safediary.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# OpenAPI / Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=none

# AssistantAI - LLM provider (spring-ai | mock)
assistantai.llm.provider=${ASSISTANTAI_LLM_PROVIDER:spring-ai}
assistantai.llm.history-limit=20

# AssistantAI - weekly clinical summary
assistantai.clinical-summary.zone=America/Lima
assistantai.clinical-summary.scheduler.enabled=true
assistantai.clinical-summary.cron=0 0 23 * * SUN

# Account used by /api/v1/assistant/chat until IAM exists
assistantai.demo-account-id=1

# Spring AI - chat provider used by assistantai.llm.provider=spring-ai (google-genai | openai | none)
spring.ai.model.chat=${SPRING_AI_CHAT_MODEL:google-genai}
assistantai.llm.spring-ai.fallback-model=${LLM_FALLBACK_MODEL:gemini-3.5-flash-lite}
# Google Gemini (spring.ai.model.chat=google-genai)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.response-mime-type=application/json
# Any OpenAI-compatible API (spring.ai.model.chat=openai). base-url must include /v1, e.g. https://api.groq.com/openai/v1
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}
# Backup provider (any OpenAI-compatible API, Groq by default): used when the primary and fallback models fail.
# Only active when LLM_BACKUP_API_KEY / assistantai.llm.backup.api-key is set. base-url must include /v1.
assistantai.llm.backup.api-key=${LLM_BACKUP_API_KEY:}
assistantai.llm.backup.base-url=${LLM_BACKUP_BASE_URL:https://api.groq.com/openai/v1}
assistantai.llm.backup.model=${LLM_BACKUP_MODEL:qwen/qwen3.8-27b}
assistantai.llm.backup.timeout-seconds=30
# AssistantAI only uses chat models: keep the other Spring AI model types off
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ===================================================================
# Care Scheduling
# ===================================================================
# Agenda timezone and grid of bookable slots (session length comes from the Clinician Directory rate)
care-scheduling.zone=America/Lima
care-scheduling.slot-step-minutes=60
# Releases one-hour holds that were not paid in time
care-scheduling.hold-expiration.scheduler.enabled=true
care-scheduling.hold-expiration.fixed-delay-ms=60000
# Video provider base URL; rooms get unguessable names
care-scheduling.video.base-url=${CARE_VIDEO_BASE_URL:https://meet.jit.si/}

# ===================================================================
# Stripe Subscriptions & Payments Configuration
# ===================================================================
stripe.api-key=${STRIPE_API_KEY:}
stripe.public-key=${STRIPE_PUBLIC_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.subscription.terra.price-id=${STRIPE_TERRA_PRICE_ID:}
stripe.subscription.astrum.price-id=${STRIPE_ASTRUM_PRICE_ID:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/api/v1/payments/subscriptions/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/api/v1/payments/subscriptions/cancel}

